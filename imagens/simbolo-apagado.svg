      <stop offset=".45" stop-color="#2A2F7B"/>
      <stop offset=".65" stop-color="#1B327A"/>
      <stop offset=".85" stop-color="#173074"/>
      <stop offset="1" stop-color="#172E70"/>
    </linearGradient>
  </defs>
  <path fill="url(#g)" d="M200 3 0 346h114zM217 0l-88 353 88 195zM0 361h115l86 187zM248 3l200 343H334zM231 0l88 353-88 195zM448 361H333l-86 187z"/>
